<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Blast - تفجير الكواكب</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { 
        width: 100vw; height: 100vh; background: #000; overflow: hidden; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff;
        background-image: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
    }

    /* ===== شاشة التحميل ===== */
    #loader { 
        position: fixed; inset: 0; background: #000; z-index: 9999; 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        transition: opacity 0.5s; 
    }
    .spinner { 
        width: 60px; height: 60px; border: 4px solid rgba(255, 215, 0, 0.1); 
        border-top-color: #FFD700; border-radius: 50%; animation: spin 1s linear infinite; 
        margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ===== واجهة المستخدم ===== */
    #game-ui { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; pointer-events: none; }
    .top-bar { padding: 20px; text-align: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
    .status-text { font-size: 16px; color: #FFD700; margin-bottom: 5px; font-weight: bold; }
    .balance-text { font-size: 22px; font-weight: 900; color: #00FF88; }
    .bottom-bar { padding: 30px 20px; text-align: center; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); pointer-events: auto; }
    
    .btn-play { 
        background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; border: none; border-radius: 30px; 
        padding: 16px 40px; font-size: 18px; font-weight: 900; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); 
        cursor: pointer; transition: 0.2s; width: 100%; max-width: 300px;
    }
    .btn-play:active { transform: scale(0.95); }
    .btn-play:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

    /* ===== الفضاء والكواكب (نظام المدارات) ===== */
    #space-area {
        flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
        perspective: 1000px; overflow: hidden;
    }
    
    /* الشمس المركزية */
    .sun {
        position: absolute; width: 80px; height: 80px; border-radius: 50%;
        background: radial-gradient(circle, #fff 10%, #FFD700 40%, #FF8C00 100%);
        box-shadow: 0 0 60px #FFD700, 0 0 100px #FF8C00;
        z-index: 5;
    }

    /* حاوية الكوكب */
    .orbit-container {
        position: absolute; top: 50%; left: 50%;
        border: 1px dashed rgba(255,255,255,0.05); /* مسار الدوران */
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; /* النقر يمر للكوكب */
    }

    /* الكوكب نفسه */
    .planet {
        position: absolute; top: 0; left: 50%;
        transform: translate(-50%, -50%);
        width: 60px; height: 60px;
        border-radius: 50%;
        cursor: pointer;
        pointer-events: auto;
        background-size: cover;
        background-position: center;
        box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.2);
        transition: transform 0.2s, filter 0.2s;
        animation: rotateOrbit var(--duration) linear infinite;
    }
    .planet:hover { filter: brightness(1.3); transform: translate(-50%, -50%) scale(1.15); z-index: 20; }
    .planet:active { transform: translate(-50%, -50%) scale(0.9); }
    
    /* الدوران */
    @keyframes rotateOrbit {
        from { transform: translate(-50%, -50%) rotate(0deg) translateX(var(--radius)) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg) translateX(var(--radius)) rotate(-360deg); }
    }

    /* شاشة الانفجار (جسيمات) */
    #particles-container { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
    .particle {
        position: absolute; width: 6px; height: 6px; border-radius: 50%;
        animation: explode 1s ease-out forwards;
    }
    @keyframes explode {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* ===== المودال ===== */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    .card { 
        background: linear-gradient(135deg, #1a1a2e, #0f3460); border: 2px solid #FFD700; border-radius: 24px; 
        padding: 30px 40px; text-align: center; transform: scale(0.8); transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); 
        box-shadow: 0 0 60px rgba(255,215,0,0.4);
    }
    #modal.show .card { transform: scale(1); }
    .card-icon { font-size: 70px; margin-bottom: 10px; }
    .card-title { color: #FFD700; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .card-amount { font-size: 36px; color: #00FF88; font-weight: 900; margin-bottom: 20px; }
    .btn-close { background: #FFD700; color: #000; padding: 12px 40px; border-radius: 20px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* ===== لوحة الإدارة ===== */
    #admin-panel { position: fixed; inset: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 20px; z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
    #admin-panel.show { display: flex; }
    .admin-input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; width: 100%; outline: none; }
    .admin-btn { background: #FFD700; color: #000; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .prize-row { display: flex; gap: 8px; margin-bottom: 8px; background: #111; padding: 10px; border-radius: 8px; align-items: center; }
    .prize-row input[type="text"], .prize-row input[type="number"] { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; }
    .prize-row input[type="color"] { width: 35px; height: 35px; border: none; background: none; cursor: pointer; }
</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <div style="color:#FFD700; font-weight:bold;">جاري مسح المجرة...</div>
</div>

<div id="game-ui">
    <div class="top-bar">
        <div class="status-text" id="status-text">استعد للانفجار!</div>
        <div class="balance-text" id="balance-text">0 SYP</div>
    </div>
    
    <div id="space-area">
        <div class="sun"></div>
        <div id="particles-container"></div>
        <!-- سيتم حقن الكواكب هنا برمجياً -->
    </div>

    <div class="bottom-bar">
        <button class="btn-play" id="play-btn" disabled>انتظر...</button>
    </div>
</div>

<div id="modal">
    <div class="card">
        <div class="card-icon" id="m-icon">💎</div>
        <div class="card-title" id="m-title">مبروك!</div>
        <div class="card-amount" id="m-amount">0 SYP</div>
        <button class="btn-close" id="m-close">استلام</button>
    </div>
</div>

<div id="admin-panel">
    <h2 style="color:#FFD700; margin-bottom: 20px; text-align:center;">⚙️ لوحة الإدارة</h2>
    <label style="color:#888; font-size:12px;">رابط الخلفية:</label>
    <input type="text" id="a-bg" class="admin-input">
    <button class="admin-btn" onclick="saveBg()">حفظ الخلفية</button>
    
    <h3 style="color:#FFD700; margin:20px 0 10px; font-size:16px;">🪐 الجوائز</h3>
    <div id="admin-prizes"></div>
    
    <button class="admin-btn" style="background: #ff4444; color: white; margin-top:20px;" onclick="document.getElementById('admin-panel').classList.remove('show')">إغلاق</button>
</div>

<script>
// ================================================================
//   الإعدادات الأساسية
// ================================================================
const API_BASE = 'https://jkl-ttvi.onrender.com'; 
const ADMIN_ID = "7011476249"; 
const urlParams = new URLSearchParams(window.location.search);
const isAdmin = urlParams.get('admin_id') === ADMIN_ID;
const USER_ID = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 123456789;

let planetsData = [];
let winningPrizeId = null;
let isPlaying = false;
let animId;

// صور كواكب حقيقية عالية الدقة (لن تبدو مقرفة)
const PLANET_IMAGES = [
    "https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/300px-The_Earth_seen_from_Apollo_17.jpg", // الأرض
    "https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/300px-OSIRIS_Mars_true_color.jpg", // المريخ
    "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Jupiter.jpg/300px-Jupiter.jpg", // المشتري
    "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Saturn_during_Equinox.jpg/300px-Saturn_during_Equinox.jpg" // زحل
];

// ================================================================
//   🔊 محرك الصوت
// ================================================================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playExplosionSound() {
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 2);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
    
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
}
function playSuccessSound() {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);
        osc.start(audioCtx.currentTime + i * 0.1);
        osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
    });
}

// ================================================================
//   🪐 بناء الكواكب في المدارات
// ================================================================
function buildPlanets(prizes) {
    const spaceArea = document.getElementById('space-area');
    // مسح الكواكب القديمة
    spaceArea.querySelectorAll('.orbit-container').forEach(el => el.remove());
    planetsData = [];

    const maxRadius = Math.min(spaceArea.clientWidth, spaceArea.clientHeight) / 2 - 40;
    const baseRadius = maxRadius / (prizes.length + 1);

    prizes.forEach((p, i) => {
        // 1. إنشاء حاوية المدار
        const orbit = document.createElement('div');
        orbit.className = 'orbit-container';
        const radius = baseRadius * (i + 1);
        orbit.style.width = (radius * 2) + 'px';
        orbit.style.height = (radius * 2) + 'px';

        // 2. إنشاء الكوكب
        const planet = document.createElement('div');
        planet.className = 'planet';
        // استخدام صور كواكب حقيقية
        planet.style.backgroundImage = `url('${PLANET_IMAGES[i % PLANET_IMAGES.length]}')`;
        
        // إعدادات الدوران
        planet.style.setProperty('--radius', radius + 'px');
        const duration = 20 + Math.random() * 20; // 20-40 ثانية للدورة
        planet.style.setProperty('--duration', duration + 's');
        planet.style.animationDirection = i % 2 === 0 ? 'normal' : 'reverse';

        // حدث النقر
        planet.onclick = () => handlePlanetClick(p, planet);

        orbit.appendChild(planet);
        spaceArea.appendChild(orbit);
        
        planetsData.push({ ...p, element: planet });
    });
}

// ================================================================
//   💥 الانفجار
// ================================================================
function handlePlanetClick(planetData, planetElement) {
    if (!isPlaying) return;

    // إيقاف مؤقت لحركة الكوكب لالتقاط موقعه
    planetElement.style.animationPlayState = 'paused';
    const rect = planetElement.getBoundingClientRect();
    const spaceRect = document.getElementById('space-area').getBoundingClientRect();
    
    const centerX = rect.left - spaceRect.left + rect.width / 2;
    const centerY = rect.top - spaceRect.top + rect.height / 2;

    if (planetData.id === winningPrizeId) {
        // ✅ الكوكب الصحيح
        isPlaying = false;
        planetElement.style.display = 'none'; // إخفاء الكوكب
        playExplosionSound();
        createExplosion(centerX, centerY);
        
        if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        
        setTimeout(() => playSuccessSound(), 800);

        fetch(`${API_BASE}/api/planet/finish`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID, prize_id: planetData.id })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                setTimeout(() => showModal(data.prize), 1000);
            }
        });
    } else {
        // ❌ كوكب خاطئ (يرتجف فقط)
        planetElement.style.animationPlayState = 'running';
        if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
    }
}

function createExplosion(x, y) {
    const container = document.getElementById('particles-container');
    const colors = ['#FFD700', '#FF8C00', '#FF4444', '#FFFFFF'];
    
    for (let i = 0; i < 100; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 200 + 50;
        p.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        
        container.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }
}

// ================================================================
//   🏆 المودال والحالة
// ================================================================
function showModal(prize) {
    document.getElementById('m-icon').textContent = prize.icon || '💎';
    document.getElementById('m-title').textContent = prize.name;
    document.getElementById('m-amount').textContent = `${prize.amount} SYP`;
    document.getElementById('modal').classList.add('show');
    
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "لقد انهيت الجولة!";
    document.getElementById('status-text').textContent = "عد غداً!";
}

document.getElementById('m-close').onclick = () => {
    document.getElementById('modal').classList.remove('show');
};

// ================================================================
//   🚀 التهيئة
// ================================================================
async function boot() {
    // تفعيل الصوت
    document.body.addEventListener('click', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

    try {
        const res = await fetch(`${API_BASE}/api/planet/data`);
        const data = await res.json();
        
        if (data.success) {
            if (data.background) document.body.style.backgroundImage = `url('${data.background}')`;
            buildPlanets(data.prizes);

            const statusRes = await fetch(`${API_BASE}/api/planet/status/${USER_ID}`);
            const statusData = await statusRes.json();
            
            if (statusData.can_play) {
                document.getElementById('play-btn').disabled = false;
                document.getElementById('play-btn').textContent = "🚀 اختر كوكباً لتفجيره!";
            } else {
                document.getElementById('play-btn').disabled = true;
                document.getElementById('play-btn').textContent = statusData.deposit_met ? `انتظر ${statusData.remaining_hours} ساعة` : "يجب الإيداع أولاً";
            }
        }
    } catch (e) {
        console.error(e);
    }

    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => document.getElementById('loader').style.display = 'none', 500);

    // التحقق من الأدمن
    if (isAdmin) {
        document.getElementById('admin-panel').classList.add('show');
        loadAdminData();
    }
}

document.getElementById('play-btn').onclick = async () => {
    if (isPlaying) return;
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "جاري بدء اللعبة...";

    try {
        const res = await fetch(`${API_BASE}/api/planet/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID })
        });
        const data = await res.json();
        
        if (data.success) {
            winningPrizeId = data.winning_prize_id;
            isPlaying = true;
            document.getElementById('play-btn').textContent = "اضغط على الكوكب الصحيح!";
            document.getElementById('status-text').textContent = "ابحث عن الكوكب...";
        } else {
            alert(data.error);
            document.getElementById('play-btn').disabled = false;
            document.getElementById('play-btn').textContent = "حاول مجدداً";
        }
    } catch (e) {
        alert("خطأ في الاتصال");
        document.getElementById('play-btn').disabled = false;
    }
};

// ================================================================
//   ⚙️ الإدارة
// ================================================================
async function loadAdminData() {
    try {
        const settingsRes = await fetch(`${API_BASE}/api/planet/admin/settings?admin_id=${ADMIN_ID}`);
        const settingsData = await settingsRes.json();
        if (settingsData.success) {
            document.getElementById('a-bg').value = settingsData.settings.bg_image_url || '';
        }

        const prizesRes = await fetch(`${API_BASE}/api/planet/admin/prizes?admin_id=${ADMIN_ID}`);
        const prizesData = await prizesRes.json();
        
        if (prizesData.success) {
            let html = '';
            prizesData.prizes.forEach(p => {
                html += `
                    <div class="prize-row">
                        <input type="text" value="${p.name}" id="p-name-${p.id}" style="flex:2;">
                        <input type="number" value="${p.amount}" id="p-amount-${p.id}" style="flex:1;">
                        <input type="number" value="${p.probability}" id="p-prob-${p.id}" style="flex:1;">
                        <input type="color" value="${p.color}" id="p-color-${p.id}">
                        <button class="admin-btn" style="width:auto; padding:5px 15px; margin:0; font-size:12px;" onclick="savePrize(${p.id})">حفظ</button>
                    </div>
                `;
            });
            document.getElementById('admin-prizes').innerHTML = html;
        }
    } catch (e) { console.error(e); }
}

async function saveBg() {
    const val = document.getElementById('a-bg').value;
    await fetch(`${API_BASE}/api/planet/admin/setting`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID, key: 'bg_image_url', value: val })
    });
    document.body.style.backgroundImage = `url('${val}')`;
    alert('تم الحفظ');
}

async function savePrize(id) {
    const name = document.getElementById(`p-name-${id}`).value;
    const amount = parseFloat(document.getElementById(`p-amount-${id}`).value);
    const prob = parseFloat(document.getElementById(`p-prob-${id}`).value);
    const color = document.getElementById(`p-color-${id}`).value;
    
    await fetch(`${API_BASE}/api/planet/admin/prizes/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID, name, amount, probability: prob, color, icon: '💎', color2: color, size: 35, is_active: true })
    });
    alert('تم الحفظ');
}

window.onload = boot;
</script>
</body>
</html>
