<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Blast 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }

    /* شاشة التحميل */
    #loading-screen { position: fixed; inset: 0; background: #0a0a0a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
    #loading-screen .loading-image { width: 70vw; max-width: 280px; aspect-ratio: 1/1; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,215,0,0.08); box-shadow: 0 0 80px rgba(255,215,0,0.04); animation: pulse 2s infinite; margin-bottom: 28px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    .progress-container { width: 60%; max-width: 220px; }
    .progress-bar-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #FFD700, #FF8C00); border-radius: 4px; transition: width 0.3s; }
    .progress-text { color: #888; font-size: 14px; margin-top: 12px; text-align: center; font-weight: 600; letter-spacing: 1px; }

    /* واجهة اللعب */
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    
    /* زر البدء في المنتصف */
    .center-btn-container {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 20;
    }
    .btn-play { 
        background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; border: none; border-radius: 40px; 
        padding: 18px 50px; font-size: 20px; font-weight: 900; cursor: pointer; 
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); transition: all 0.3s ease;
        animation: btnPulse 2s infinite;
    }
    @keyframes btnPulse {
        0% { transform: scale(1); box-shadow: 0 0 40px rgba(255,215,0,0.6); }
        50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,215,0,0.8); }
        100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,215,0,0.6); }
    }
    .btn-play:disabled { background: #333; color: #777; box-shadow: none; animation: none; cursor: not-allowed; }

    /* مؤقت الانتظار */
    .cooldown-container {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        display: none; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); padding: 30px 50px; border-radius: 20px;
        border: 1px solid rgba(255, 215, 0, 0.3); pointer-events: auto; z-index: 20; text-align: center;
    }
    .cooldown-container.show { display: flex; }
    .cooldown-title { color: #FFD700; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    .cooldown-timer { color: #00FF88; font-size: 36px; font-weight: 900; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
    .cooldown-sub { color: #888; font-size: 14px; margin-top: 10px; }

    /* مودال الجائزة (النتيجة) */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    .card { background: linear-gradient(135deg, #1a1a2e, #0f3460); border: 2px solid #FFD700; border-radius: 24px; padding: 40px; text-align: center; transform: scale(0.8); transition: 0.4s; box-shadow: 0 0 60px rgba(255,215,0,0.4); max-width: 85%; }
    #modal.show .card { transform: scale(1); }
    .card-icon { font-size: 80px; margin-bottom: 10px; animation: float 2s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .card-title { color: #FFD700; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .card-amount { font-size: 40px; color: #00FF88; font-weight: 900; margin-bottom: 20px; }
    .btn-close { background: #FFD700; color: #000; padding: 12px 40px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }

    /* ✅ مودال إشعار الإيداع (جديد وأنيق) */
    #deposit-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 150; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
    #deposit-modal.show { opacity: 1; pointer-events: auto; }
    .deposit-card { 
        background: linear-gradient(135deg, #1a1a2e, #0f3460); 
        border: 2px solid #FF4444; border-radius: 24px; padding: 35px 25px; 
        text-align: center; transform: scale(0.8); transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        box-shadow: 0 0 60px rgba(255, 68, 68, 0.3); max-width: 85%; width: 320px;
    }
    #deposit-modal.show .deposit-card { transform: scale(1); }
    .deposit-icon { font-size: 60px; margin-bottom: 15px; animation: shake 0.5s infinite; }
    @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        75% { transform: rotate(10deg); }
    }
    .deposit-title { color: #FFD700; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
    .deposit-text { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .deposit-text strong { color: #00FF88; font-size: 18px; }
    .deposit-info { 
        background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.3); 
        padding: 12px; border-radius: 12px; margin-bottom: 20px; 
    }
    .deposit-info .label { color: #888; font-size: 12px; margin-bottom: 4px; }
    .deposit-info .value { color: #FF4444; font-size: 20px; font-weight: bold; }
    .btn-deposit-close { 
        background: #FFD700; color: #000; border: none; padding: 12px 40px; 
        border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; 
    }

    /* لوحة الإدارة */
    #admin-panel { position: fixed; inset: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 20px; z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
    #admin-panel.show { display: flex; }
    .admin-header { color: #FFD700; margin-bottom: 20px; text-align: center; font-size: 20px; font-weight: bold; }
    
    .setting-group { background: #111; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .setting-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .setting-row label { color: #888; font-size: 13px; min-width: 100px; }
    .setting-row input, .setting-row select { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; outline: none; min-width: 150px; font-size: 13px; }
    .btn-save { background: #FFD700; color: #000; padding: 10px 20px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
    .btn-danger { background: #ff4444; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
    
    .prize-item { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    .prize-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .prize-row input[type="text"], .prize-row input[type="number"] { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; min-width: 60px; font-size: 12px; }
    .prize-row input[type="color"] { width: 40px; height: 40px; border: none; background: none; cursor: pointer; }
    .add-prize-btn { background: #00FF88; color: #000; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; margin-bottom: 15px; font-size: 14px; }
</style>
</head>
<body>

<div id="loading-screen">
    <img class="loading-image" id="loadingImage" src="https://via.placeholder.com/200/1a1a2e/FFD700?text=🪐" alt="Loading">
    <div class="progress-container">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="loaderProgressBar"></div></div>
        <div class="progress-text" id="loaderStatusText">0%</div>
    </div>
</div>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="center-btn-container" id="start-container">
        <button class="btn-play" id="play-btn" disabled>انتظر...</button>
    </div>

    <div class="cooldown-container" id="cooldown-container">
        <div class="cooldown-title">⏳ فترة الانتظار</div>
        <div class="cooldown-timer" id="cooldown-timer">00:00:00</div>
        <div class="cooldown-sub">عد بعد انتهاء المؤقت للعب مرة أخرى</div>
    </div>
</div>

<!-- مودال الجائزة -->
<div id="modal">
    <div class="card">
        <div class="card-icon" id="m-icon">💎</div>
        <div class="card-title" id="m-title">مبروك!</div>
        <div class="card-amount" id="m-amount">0 SYP</div>
        <button class="btn-close" id="m-close">استلام</button>
    </div>
</div>

<!-- ✅ مودال الإيداع الجديد -->
<div id="deposit-modal">
    <div class="deposit-card">
        <div class="deposit-icon">🚫</div>
        <div class="deposit-title">شرط الإيداع مطلوب</div>
        <div class="deposit-text">
            عذراً، لا يمكنك اللعب حالياً.<br>
            يجب عليك إيداع مبلغ في البوت أولاً.
        </div>
        <div class="deposit-info">
            <div class="label">المبلغ المطلوب</div>
            <div class="value" id="d-min">0 SYP</div>
        </div>
        <div class="deposit-info" style="background: rgba(0,255,136,0.05); border-color: rgba(0,255,136,0.2);">
            <div class="label">رصيدك الحالي</div>
            <div class="value" style="color: #00FF88;" id="d-current">0 SYP</div>
        </div>
        <button class="btn-deposit-close" onclick="document.getElementById('deposit-modal').classList.remove('show')">حسناً</button>
    </div>
</div>

<div id="admin-panel">
    <h2 class="admin-header">⚙️ لوحة الإدارة</h2>
    
    <div class="setting-group">
        <h3 style="color: #FFD700; margin-bottom: 10px; font-size: 16px;">🖼️ الصور والخلفيات</h3>
        <div class="setting-row">
            <label>صورة الخلفية:</label>
            <input type="text" id="a-bg" placeholder="رابط صورة الخلفية">
            <button class="btn-save" onclick="saveSetting('bg_image_url', document.getElementById('a-bg').value)">حفظ</button>
        </div>
        <div class="setting-row">
            <label>صورة اللودينغ:</label>
            <input type="text" id="a-loading" placeholder="رابط صورة التحميل">
            <button class="btn-save" onclick="saveSetting('loading_image_url', document.getElementById('a-loading').value)">حفظ</button>
        </div>
    </div>

    <div class="setting-group">
        <h3 style="color: #FFD700; margin-bottom: 10px; font-size: 16px;">💰 شرط الإيداع</h3>
        <div class="setting-row">
            <label>تفعيل الشرط:</label>
            <select id="a-deposit-req">
                <option value="false">معطل</option>
                <option value="true">مفعل</option>
            </select>
            <button class="btn-save" onclick="saveSetting('deposit_required', document.getElementById('a-deposit-req').value)">حفظ</button>
        </div>
        <div class="setting-row">
            <label>الحد الأدنى للإيداع:</label>
            <input type="number" id="a-deposit-min" placeholder="1000">
            <button class="btn-save" onclick="saveSetting('deposit_min_amount', document.getElementById('a-deposit-min').value)">حفظ</button>
        </div>
        <div class="setting-row">
            <label>فترة التحقق (ساعة):</label>
            <input type="number" id="a-deposit-hours" placeholder="24">
            <button class="btn-save" onclick="saveSetting('deposit_check_hours', document.getElementById('a-deposit-hours').value)">حفظ</button>
        </div>
    </div>

    <div class="setting-group">
        <h3 style="color: #FFD700; margin-bottom: 10px; font-size: 16px;">🪐 الجوائز والكواكب</h3>
        <button class="add-prize-btn" onclick="addPrize()">➕ إضافة جائزة جديدة (كوكب)</button>
        <div id="admin-prizes"></div>
    </div>
    
    <button class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="document.getElementById('admin-panel').classList.remove('show')">إغلاق اللوحة</button>
</div>

<script>
// ================================================================
//   الإعدادات الأساسية
// ================================================================
const API_BASE = 'https://jkl-ttvi.onrender.com';
const ADMIN_ID = "7011476249";
const urlParams = new URLSearchParams(window.location.search);
let USER_ID = parseInt(urlParams.get('user_id')) || window.Telegram?.WebApp?.initDataUnsafe?.user?.id;

if (!USER_ID) {
    document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>⚠️ يرجى فتح اللعبة من داخل البوت.</h2>";
    throw new Error("No User ID");
}

const isAdmin = String(USER_ID) === String(ADMIN_ID);
if (isAdmin) document.getElementById('admin-panel').classList.add('show');

let isPlaying = false, planetsMeshes = [], particles = [], currentSettings = {}, orbitLines = [];
let cooldownInterval = null;

// ================================================================
//   الصوتيات (تم إصلاح صوت الانفجار)
// ================================================================
const backgroundMusic = new Howl({ 
    src: ['https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'], 
    loop: true, volume: 0.15 
});

// ✅ صوت انفجار حقيقي وقوي مضمون العمل
const soundExplosion = new Howl({ 
    src: ['https://cdn.pixabay.com/download/audio/2022/03/15/audio_2e5c6f3e3f.mp3?filename=explosion-01-85372.mp3'],
    volume: 1.0
});

const soundSuccess = new Howl({ 
    src: ['https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg'], 
    volume: 0.8 
});

const soundClick = new Howl({ 
    src: ['https://actions.google.com/sounds/v1/ui/click.ogg'], 
    volume: 0.4 
});

const soundError = new Howl({ 
    src: ['https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg'], 
    volume: 0.5 
});

// ================================================================
//   Three.js
// ================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 35, 95);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('canvas-container').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(4000 * 3);
for (let i = 0; i < 4000 * 3; i++) starPos[i] = (Math.random() - 0.5) * 400;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 })));

// ================================================================
//   دوال الإنشاء
// ================================================================
function clearPlanets() {
    planetsMeshes.forEach(m => scene.remove(m));
    planetsMeshes = [];
    orbitLines.forEach(line => scene.remove(line));
    orbitLines = [];
}

function createOrbitLine(radius) {
    const points = [];
    const segments = 128;
    for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.1 });
    const line = new THREE.Line(geometry, material);
    scene.add(line);
    orbitLines.push(line);
}

function createPlanet(textureUrl, color, orbitRadius, speed, prizeData, startAngle) {
    const geo = new THREE.SphereGeometry(4, 64, 64); 
    let mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8, metalness: 0.2 });
    
    if (textureUrl) {
        new THREE.TextureLoader().load(textureUrl, (tex) => {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            tex.center.set(0.5, 0.5);
            mat.map = tex;
            mat.needsUpdate = true;
        });
    }
    
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = { prize: prizeData, orbitRadius, speed, angle: startAngle };
    mesh.rotation.x = 0.2;
    scene.add(mesh);
    planetsMeshes.push(mesh);
}

function create3DExplosion(position, color) {
    const count = 300;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const velocities = [];
    const colors = [];
    
    const baseColor = new THREE.Color(color);
    const fireColor1 = new THREE.Color('#FF4500');
    const fireColor2 = new THREE.Color('#FFD700');

    for (let i = 0; i < count; i++) {
        positions[i * 3] = position.x;
        positions[i * 3 + 1] = position.y;
        positions[i * 3 + 2] = position.z;
        
        const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
        velocities.push(dir.multiplyScalar(Math.random() * 2.5 + 0.5));
        
        const rand = Math.random();
        let particleColor = rand < 0.4 ? fireColor1 : (rand < 0.8 ? fireColor2 : baseColor);
        colors.push(particleColor.r, particleColor.g, particleColor.b);
    }
    
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
    
    const material = new THREE.PointsMaterial({ 
        size: 1.2, vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending
    });
    
    const ps = new THREE.Points(geometry, material);
    ps.userData = { velocities, life: 1 };
    scene.add(ps);
    particles.push(ps);
}

// ================================================================
//   حلقة الرسم
// ================================================================
let clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    
    planetsMeshes.forEach(m => {
        if (!m.visible) return;
        const d = m.userData;
        d.angle += d.speed * delta * 60;
        m.position.x = Math.cos(d.angle) * d.orbitRadius;
        m.position.z = Math.sin(d.angle) * d.orbitRadius;
        m.rotation.y += 0.01;
    });

    for (let i = particles.length - 1; i >= 0; i--) {
        const ps = particles[i], pos = ps.geometry.attributes.position.array;
        ps.userData.velocities.forEach((v, j) => { 
            pos[j * 3] += v.x; pos[j * 3 + 1] += v.y; pos[j * 3 + 2] += v.z; 
        });
        ps.geometry.attributes.position.needsUpdate = true;
        ps.material.opacity -= 0.01;
        ps.userData.life -= 0.01;
        if (ps.userData.life <= 0) { scene.remove(ps); particles.splice(i, 1); }
    }
    renderer.render(scene, camera);
}
animate();

// ================================================================
//   التفاعل
// ================================================================
const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
window.addEventListener('pointerdown', (e) => {
    if (!isPlaying) return;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planetsMeshes);
    if (intersects.length > 0) handlePlanetClick(intersects[0].object);
});

function handlePlanetClick(planet) {
    isPlaying = false;
    backgroundMusic.stop();
    document.getElementById('play-btn').style.display = 'none';
    document.getElementById('start-container').style.display = 'none';

    const clickedPrize = planet.userData.prize;
    
    fetch(`${API_BASE}/api/planet/click`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, prize_id: clickedPrize.id })
    }).then(r => r.json()).then(data => {
        if (data.success) {
            planet.visible = false;
            create3DExplosion(planet.position, clickedPrize.color);
            soundExplosion.play(); // ✅ صوت الانفجار
            
            setTimeout(() => {
                if (data.matched) {
                    soundSuccess.play();
                    showModal(data.prize);
                } else {
                    soundError.play();
                    showModal(null);
                }
                startCooldown(24 * 3600);
            }, 1000);
        } else {
            alert(data.error || 'خطأ');
        }
    });
}

// ================================================================
//   التحميل
// ================================================================
async function loadGame() {
    try {
        const res = await fetch(`${API_BASE}/api/planet/data`);
        const data = await res.json();
        
        if (data.success) {
            clearPlanets();
            const numRings = Math.ceil(data.prizes.length / 4);
            for (let r = 0; r < numRings; r++) createOrbitLine(18 + (r * 12));

            data.prizes.forEach((p, index) => {
                const ringIndex = Math.floor(index / 4);
                const positionInRing = index % 4;
                const orbitRadius = 18 + (ringIndex * 12);
                const startAngle = (positionInRing * Math.PI / 2) + (ringIndex * 0.3);
                const speed = 0.004 - (ringIndex * 0.0005);
                createPlanet(p.texture_url, p.color, orbitRadius, speed, p, startAngle);
            });

            if (data.background) document.body.style.backgroundImage = `url('${data.background}')`;
            if (data.loading_image) document.getElementById('loadingImage').src = data.loading_image;
            
            const statusRes = await fetch(`${API_BASE}/api/planet/status/${USER_ID}`);
            const statusData = await statusRes.json();
            
            const btn = document.getElementById('play-btn');
            const cooldown = document.getElementById('cooldown-container');
            
            if (statusData.can_play) {
                btn.disabled = false;
                btn.textContent = "🚀 اختر كوكباً لتفجيره!";
                btn.style.display = 'block';
                cooldown.classList.remove('show');
            } else {
                btn.style.display = 'none';
                cooldown.classList.add('show');
                startCooldown(statusData.remaining_hours * 3600 + statusData.remaining_minutes * 60);
            }
        }
    } catch (e) { console.error(e); }
}

function startCooldown(seconds) {
    const container = document.getElementById('cooldown-container');
    const timer = document.getElementById('cooldown-timer');
    container.classList.add('show');
    document.getElementById('start-container').style.display = 'none';

    if (cooldownInterval) clearInterval(cooldownInterval);
    let remaining = seconds;
    
    function updateTimer() {
        if (remaining <= 0) {
            clearInterval(cooldownInterval);
            container.classList.remove('show');
            document.getElementById('start-container').style.display = 'flex';
            const btn = document.getElementById('play-btn');
            btn.disabled = false;
            btn.style.display = 'block';
            btn.textContent = "🚀 اختر كوكباً لتفجيره!";
            return;
        }
        const h = Math.floor(remaining / 3600);
        const m = Math.floor((remaining % 3600) / 60);
        const s = remaining % 60;
        timer.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        remaining--;
    }
    updateTimer();
    cooldownInterval = setInterval(updateTimer, 1000);
}

function updateLoading(p) { 
    document.getElementById('loaderProgressBar').style.width = p + '%';
    document.getElementById('loaderStatusText').textContent = p + '%';
}

async function init() {
    let progress = 0;
    const interval = setInterval(() => { progress += Math.random() * 10; if (progress > 90) progress = 90; updateLoading(Math.round(progress)); }, 100);
    await loadGame();
    if (isAdmin) loadAdminData();
    clearInterval(interval);
    updateLoading(100);
    setTimeout(() => { 
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
    }, 500);
}

// ================================================================
//   بدء اللعب
// ================================================================
document.getElementById('play-btn').onclick = async () => {
    soundClick.play();
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "جاري بدء اللعبة...";
    
    const res = await fetch(`${API_BASE}/api/planet/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID })
    });
    const data = await res.json();
    
    if (data.success) {
        isPlaying = true;
        document.getElementById('start-container').style.display = 'none';
        backgroundMusic.play();
    } else {
        // ✅ عرض مودال الإيداع الجديد
        if (data.deposit_required) {
            document.getElementById('d-min').textContent = `${data.min_deposit} SYP`;
            document.getElementById('d-current').textContent = `${data.current_deposits} SYP`;
            document.getElementById('deposit-modal').classList.add('show');
        } else {
            alert(data.error);
        }
        document.getElementById('play-btn').disabled = false;
        document.getElementById('play-btn').textContent = "حاول مجدداً";
    }
};

function showModal(prize) {
    if (prize) {
        document.getElementById('m-icon').textContent = prize.icon || '💎';
        document.getElementById('m-title').textContent = prize.name;
        document.getElementById('m-amount').textContent = `${prize.amount} SYP`;
        document.getElementById('m-amount').style.color = '#00FF88';
    } else {
        document.getElementById('m-icon').textContent = '😅';
        document.getElementById('m-title').textContent = 'حظ أوفر المرة القادمة';
        document.getElementById('m-amount').textContent = '';
    }
    document.getElementById('modal').classList.add('show');
}
document.getElementById('m-close').onclick = () => document.getElementById('modal').classList.remove('show');

// ================================================================
//   لوحة الإدارة
// ================================================================
async function saveSetting(key, value) {
    try {
        const res = await fetch(`${API_BASE}/api/planet/admin/setting`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ admin_id: ADMIN_ID, key, value })
        });
        const data = await res.json();
        if (data.success) {
            alert('✅ تم الحفظ');
            if (key === 'bg_image_url') document.body.style.backgroundImage = `url('${value}')`;
            if (key === 'loading_image_url') document.getElementById('loadingImage').src = value;
        }
    } catch(e) { alert('❌ خطأ'); }
}

async function loadAdminData() {
    try {
        const sRes = await fetch(`${API_BASE}/api/planet/admin/settings?admin_id=${ADMIN_ID}`);
        const sData = await sRes.json();
        if (sData.success) {
            currentSettings = sData.settings;
            document.getElementById('a-bg').value = currentSettings.bg_image_url || '';
            document.getElementById('a-loading').value = currentSettings.loading_image_url || '';
            
            if (currentSettings.deposit_required) document.getElementById('a-deposit-req').value = currentSettings.deposit_required;
            if (currentSettings.deposit_min_amount) document.getElementById('a-deposit-min').value = currentSettings.deposit_min_amount;
            if (currentSettings.deposit_check_hours) document.getElementById('a-deposit-hours').value = currentSettings.deposit_check_hours;
        }
        
        const pRes = await fetch(`${API_BASE}/api/planet/admin/prizes?admin_id=${ADMIN_ID}`);
        const pData = await pRes.json();
        if (pData.success) renderAdminPrizes(pData.prizes);
    } catch(e) { console.error(e); }
}

function renderAdminPrizes(prizes) {
    let html = '';
    prizes.forEach(p => {
        html += `
            <div class="prize-item">
                <div class="prize-row" style="margin-bottom: 8px;">
                    <input type="text" value="${p.name}" id="p-name-${p.id}" placeholder="اسم الجائزة" style="flex:2;">
                    <input type="number" value="${p.amount}" id="p-amount-${p.id}" placeholder="المبلغ" style="flex:1;">
                    <input type="number" value="${p.probability}" id="p-prob-${p.id}" placeholder="نسبة %" style="flex:1;">
                </div>
                <div class="prize-row">
                    <input type="text" value="${p.texture_url || ''}" id="p-tex-${p.id}" placeholder="رابط صورة الكوكب" style="flex:3;">
                    <input type="color" value="${p.color || '#3498db'}" id="p-color-${p.id}">
                    <button class="btn-save" onclick="savePrize(${p.id})">حفظ</button>
                    <button class="btn-danger" onclick="deletePrize(${p.id})">حذف</button>
                </div>
            </div>`;
    });
    document.getElementById('admin-prizes').innerHTML = html;
}

async function savePrize(id) {
    const name = document.getElementById(`p-name-${id}`).value;
    const amount = parseFloat(document.getElementById(`p-amount-${id}`).value);
    const prob = parseFloat(document.getElementById(`p-prob-${id}`).value);
    const tex = document.getElementById(`p-tex-${id}`).value;
    const color = document.getElementById(`p-color-${id}`).value;
    
    await fetch(`${API_BASE}/api/planet/admin/prizes/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID, name, amount, probability: prob, color, texture_url: tex })
    });
    alert('✅ تم الحفظ');
    loadGame();
}

async function addPrize() {
    const res = await fetch(`${API_BASE}/api/planet/admin/prizes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID, name: 'جائزة جديدة', amount: 50, probability: 10, color: '#e74c3c', texture_url: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg' })
    });
    const data = await res.json();
    if (data.success) {
        alert('✅ تمت الإضافة');
        loadAdminData();
        loadGame();
    }
}

async function deletePrize(id) {
    if (!confirm('هل أنت متأكد من حذف هذه الجائزة؟')) return;
    await fetch(`${API_BASE}/api/planet/admin/prizes/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID })
    });
    alert('✅ تم الحذف');
    loadAdminData();
    loadGame();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
