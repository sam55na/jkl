<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Blast 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }

    /* شاشة التحميل (مطابقة للبطاقات) */
    #loading-screen {
        display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 9999; background: #0a0a0a; flex-direction: column; align-items: center; justify-content: center;
    }
    #loading-screen .loading-image {
        width: 70vw; max-width: 280px; aspect-ratio: 1/1; border-radius: 50%; object-fit: cover;
        border: 2px solid rgba(255, 215, 0, 0.08); box-shadow: 0 0 80px rgba(255, 215, 0, 0.04);
        animation: loadingPulse 2s ease-in-out infinite; margin-bottom: 28px;
    }
    @keyframes loadingPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.02); opacity: 0.85; }
    }
    #loading-screen .progress-container { width: 60%; max-width: 220px; }
    #loading-screen .progress-bar-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
    #loading-screen .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #FFD700, #FF8C00); border-radius: 4px; transition: width 0.3s ease; }
    #loading-screen .progress-text { color: #888; font-size: 14px; margin-top: 12px; text-align: center; font-weight: 600; letter-spacing: 1px; }

    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; pointer-events: none; }
    .top-bar { padding: 20px; text-align: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
    .status-text { font-size: 16px; color: #FFD700; margin-bottom: 5px; font-weight: bold; text-shadow: 0 0 10px #FFD700; }
    .balance-text { font-size: 24px; font-weight: 900; color: #00FF88; text-shadow: 0 0 10px #00FF88; }
    
    .bottom-bar { margin-top: auto; padding: 30px 20px; text-align: center; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); pointer-events: auto; }
    .btn-play { 
        background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; border: none; border-radius: 40px; 
        padding: 16px 40px; font-size: 18px; font-weight: 900; cursor: pointer; 
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); transition: 0.3s; width: 100%; max-width: 300px;
    }
    .btn-play:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    .card { background: linear-gradient(135deg, #1a1a2e, #0f3460); border: 2px solid #FFD700; border-radius: 24px; padding: 40px; text-align: center; transform: scale(0.8); transition: 0.4s; box-shadow: 0 0 60px rgba(255,215,0,0.4); }
    #modal.show .card { transform: scale(1); }
    .card-icon { font-size: 80px; margin-bottom: 10px; animation: float 2s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    .card-title { color: #FFD700; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .card-amount { font-size: 40px; color: #00FF88; font-weight: 900; margin-bottom: 20px; }
    .btn-close { background: #FFD700; color: #000; padding: 12px 40px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }

    #admin-panel { position: fixed; inset: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 20px; z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
    #admin-panel.show { display: flex; }
    .admin-input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; width: 100%; outline: none; }
    .admin-btn { background: #FFD700; color: #000; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .prize-row { display: flex; gap: 8px; margin-bottom: 8px; background: #111; padding: 10px; border-radius: 8px; align-items: center; flex-wrap: wrap; }
    .prize-row input[type="text"], .prize-row input[type="number"] { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; min-width: 60px; }
</style>
</head>
<body>

<!-- شاشة التحميل (مطابقة للبطاقات) -->
<div id="loading-screen">
    <img class="loading-image" id="loadingImage" src="https://via.placeholder.com/200/1a1a2e/FFD700?text=🪐" alt="Loading">
    <div class="progress-container">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="loaderProgressBar"></div>
        </div>
        <div class="progress-text" id="loaderStatusText">0%</div>
    </div>
</div>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="top-bar">
        <div class="status-text" id="status-text">استعد للانفجار!</div>
        <div class="balance-text" id="balance-text">0 SYP</div>
    </div>
    <div class="bottom-bar">
        <button class="btn-play" id="play-btn" disabled>انتظر...</button>
    </div>
</div>

<div id="modal">
    <div class="card">
        <div class="card-icon" id="m-icon">💎</div>
        <div class="card-title" id="m-title">مبروك!</div>
        <div class="card-amount" id="m-amount">0 SYP</div>
        <button class="btn-close" id="m-close">استلام</button>
    </div>
</div>

<div id="admin-panel">
    <h2 style="color:#FFD700; margin-bottom: 20px; text-align:center;">⚙️ لوحة الإدارة</h2>
    <label style="color:#888; font-size:12px;">رابط الخلفية:</label>
    <input type="text" id="a-bg" class="admin-input">
    <button class="admin-btn" onclick="saveBg()">حفظ الخلفية</button>
    <h3 style="color:#FFD700; margin:20px 0 10px; font-size:16px;">🪐 الجوائز</h3>
    <div id="admin-prizes"></div>
    <button class="admin-btn" style="background: #ff4444; color: white; margin-top:20px;" onclick="document.getElementById('admin-panel').classList.remove('show')">إغلاق</button>
</div>

<script>
// ================================================================
//   الإعدادات الأساسية
// ================================================================
const API_BASE = 'https://jkl-ttvi.onrender.com';
const ADMIN_ID = "7011476249";
const urlParams = new URLSearchParams(window.location.search);
let USER_ID = parseInt(urlParams.get('user_id')) || window.Telegram?.WebApp?.initDataUnsafe?.user?.id;

if (!USER_ID) {
    document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:50px;'>⚠️ يرجى فتح اللعبة من داخل البوت.</h2>";
    throw new Error("No User ID");
}

const isAdmin = String(USER_ID) === String(ADMIN_ID);
if (isAdmin) {
    document.getElementById('admin-panel').classList.add('show');
    loadAdminData();
}

let isPlaying = false, planetsMeshes = [], particles = [];

// ================================================================
//   الصوتيات (تشمل صوت الخلفية)
// ================================================================
const soundAmbient = new Howl({ src: ['https://actions.google.com/sounds/v1/ambiences/deep_space_ambience.ogg'], loop: true, volume: 0.3 });
const soundExplosion = new Howl({ src: ['https://actions.google.com/sounds/v1/explosions/deep_explosion.ogg'], volume: 0.9 });
const soundSuccess = new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg'], volume: 0.8 });
const soundClick = new Howl({ src: ['https://actions.google.com/sounds/v1/ui/click.ogg'], volume: 0.4 });
const soundError = new Howl({ src: ['https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg'], volume: 0.5 });

// ================================================================
//   Three.js
// ================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 80;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);
const dirLight1 = new THREE.DirectionalLight(0xffffff, 1);
dirLight1.position.set(1, 1, 1);
scene.add(dirLight1);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 1);
dirLight2.position.set(-1, -1, -1);
scene.add(dirLight2);

const starGeometry = new THREE.BufferGeometry();
const starPositions = new Float32Array(3000 * 3);
for (let i = 0; i < 3000 * 3; i++) starPositions[i] = (Math.random() - 0.5) * 300;
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 })));

// ================================================================
//   إنشاء الكوكب (تغطية 100% للصورة)
// ================================================================
function createPlanet(textureUrl, color, orbitRadius, speed, prizeData) {
    const size = 5;
    const geometry = new THREE.SphereGeometry(size, 128, 128);
    
    let material;
    if (textureUrl) {
        const loader = new THREE.TextureLoader();
        material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.9, metalness: 0.1 });
        
        loader.load(textureUrl, (texture) => {
            // ✅ إصلاح تغطية الصورة
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1);
            texture.offset.set(0, 0);
            texture.center.set(0.5, 0.5);
            texture.minFilter = THREE.LinearFilter;
            
            material.map = texture;
            material.needsUpdate = true;
        });
    } else {
        material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
    }

    const mesh = new THREE.Mesh(geometry, material);
    mesh.userData = { prize: prizeData, orbitRadius, speed, angle: Math.random() * Math.PI * 2 };
    scene.add(mesh);
    planetsMeshes.push(mesh);
}

function create3DExplosion(position, color) {
    const c = 200, g = new THREE.BufferGeometry(), p = new Float32Array(c * 3), v = [];
    for (let i = 0; i < c; i++) {
        p[i * 3] = position.x; p[i * 3 + 1] = position.y; p[i * 3 + 2] = position.z;
        v.push(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(Math.random() * 1.5 + 0.5));
    }
    g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    const ps = new THREE.Points(g, new THREE.PointsMaterial({ color: color, size: 0.8, transparent: true }));
    ps.userData = { velocities: v, life: 1 };
    scene.add(ps);
    particles.push(ps);
}

function animate() {
    requestAnimationFrame(animate);
    planetsMeshes.forEach(m => {
        if (!m.visible) return;
        const d = m.userData;
        d.angle += d.speed;
        m.position.x = Math.cos(d.angle) * d.orbitRadius;
        m.position.z = Math.sin(d.angle) * d.orbitRadius * 0.5 - 20;
        m.position.y = Math.sin(d.angle) * d.orbitRadius * 0.3;
        m.rotation.y += 0.003;
    });

    for (let i = particles.length - 1; i >= 0; i--) {
        const ps = particles[i], pos = ps.geometry.attributes.position.array;
        ps.userData.velocities.forEach((v, j) => { pos[j * 3] += v.x; pos[j * 3 + 1] += v.y; pos[j * 3 + 2] += v.z; });
        ps.geometry.attributes.position.needsUpdate = true;
        ps.material.opacity -= 0.015;
        ps.userData.life -= 0.015;
        if (ps.userData.life <= 0) { scene.remove(ps); particles.splice(i, 1); }
    }
    renderer.render(scene, camera);
}
animate();

// ================================================================
//   التفاعل
// ================================================================
const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
window.addEventListener('pointerdown', (e) => {
    if (!isPlaying) return;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planetsMeshes);
    if (intersects.length > 0) handlePlanetClick(intersects[0].object);
});

function handlePlanetClick(planet) {
    isPlaying = false;
    soundAmbient.stop(); // إيقاف صوت الخلفية فوراً
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "انتهت الجولة!";

    const prize = planet.userData.prize;
    fetch(`${API_BASE}/api/planet/click`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, prize_id: prize.id })
    })
    .then(r => r.json())
    .then(data => {
        if (data.matched) {
            planet.visible = false;
            create3DExplosion(planet.position, prize.color);
            soundExplosion.play();
            setTimeout(() => soundSuccess.play(), 800);
            setTimeout(() => showModal(data.prize, true), 1200);
        } else {
            planet.visible = false;
            create3DExplosion(planet.position, '#ff4444');
            soundError.play();
            setTimeout(() => showModal(null, false), 1200);
        }
    });
}

document.getElementById('play-btn').onclick = async () => {
    soundClick.play();
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "جاري بدء اللعبة...";
    
    const res = await fetch(`${API_BASE}/api/planet/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID })
    });
    const data = await res.json();
    
    if (data.success) {
        isPlaying = true;
        soundAmbient.play(); // بدء صوت الخلفية
        document.getElementById('play-btn').textContent = "اضغط على كوكب (فرصة واحدة!)";
        document.getElementById('status-text').textContent = "ابحث عن الكوكب...";
    } else {
        alert(data.error);
        document.getElementById('play-btn').disabled = false;
        document.getElementById('play-btn').textContent = "حاول مجدداً";
    }
};

// ================================================================
//   شاشة التحميل والتهيئة
// ================================================================
function updateLoading(progress) {
    document.getElementById('loaderProgressBar').style.width = progress + '%';
    document.getElementById('loaderStatusText').textContent = progress + '%';
}

async function init() {
    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.random() * 10;
        if (progress > 90) progress = 90;
        updateLoading(Math.round(progress));
    }, 100);

    try {
        const res = await fetch(`${API_BASE}/api/planet/data`);
        const data = await res.json();
        
        if (data.success) {
            data.prizes.forEach((p, index) => {
                const orbitRadius = 12 + (index * 6); 
                createPlanet(p.texture_url, p.color, orbitRadius, 0.002 + (index * 0.0005), p);
            });

            const statusRes = await fetch(`${API_BASE}/api/planet/status/${USER_ID}`);
            const statusData = await statusRes.json();
            if (statusData.can_play) {
                document.getElementById('play-btn').disabled = false;
                document.getElementById('play-btn').textContent = "🚀 اختر كوكباً لتفجيره!";
            } else {
                document.getElementById('play-btn').disabled = true;
                document.getElementById('play-btn').textContent = `انتظر ${statusData.remaining_hours} ساعة`;
            }
        }
    } catch (e) { console.error(e); }

    clearInterval(interval);
    updateLoading(100);
    setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
    }, 500);
}

function showModal(prize, isWin) {
    if (isWin && prize) {
        document.getElementById('m-icon').textContent = prize.icon || '💎';
        document.getElementById('m-title').textContent = prize.name;
        document.getElementById('m-amount').textContent = `${prize.amount} SYP`;
        document.getElementById('m-amount').style.color = '#00FF88';
    } else {
        document.getElementById('m-icon').textContent = '😅';
        document.getElementById('m-title').textContent = 'حظ أوفر المرة القادمة';
        document.getElementById('m-amount').textContent = '';
    }
    document.getElementById('modal').classList.add('show');
    document.getElementById('status-text').textContent = "عد غداً!";
}
document.getElementById('m-close').onclick = () => document.getElementById('modal').classList.remove('show');

// الإدارة
async function loadAdminData() {
    try {
        const sRes = await fetch(`${API_BASE}/api/planet/admin/settings?admin_id=${ADMIN_ID}`);
        const sData = await sRes.json();
        if (sData.success) document.getElementById('a-bg').value = sData.settings.bg_image_url || '';

        const pRes = await fetch(`${API_BASE}/api/planet/admin/prizes?admin_id=${ADMIN_ID}`);
        const pData = await pRes.json();
        if (pData.success) {
            let html = '';
            pData.prizes.forEach(p => {
                html += `<div class="prize-row">
                    <input type="text" value="${p.name}" id="p-name-${p.id}" style="flex:2;">
                    <input type="number" value="${p.amount}" id="p-amount-${p.id}" style="flex:1;">
                    <input type="number" value="${p.probability}" id="p-prob-${p.id}" style="flex:1;">
                    <input type="text" value="${p.texture_url || ''}" id="p-tex-${p.id}" style="flex:2;">
                    <button class="admin-btn" style="width:auto; padding:5px 15px; margin:0; font-size:12px;" onclick="savePrize(${p.id})">حفظ</button>
                </div>`;
            });
            document.getElementById('admin-prizes').innerHTML = html;
        }
    } catch(e) { console.error(e); }
}

async function saveBg() {
    const val = document.getElementById('a-bg').value;
    await fetch(`${API_BASE}/api/planet/admin/setting`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin_id: ADMIN_ID, key: 'bg_image_url', value: val }) });
    alert('✅ تم الحفظ');
}

async function savePrize(id) {
    const name = document.getElementById(`p-name-${id}`).value;
    const amount = parseFloat(document.getElementById(`p-amount-${id}`).value);
    const prob = parseFloat(document.getElementById(`p-prob-${id}`).value);
    const tex = document.getElementById(`p-tex-${id}`).value;
    await fetch(`${API_BASE}/api/planet/admin/prizes/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin_id: ADMIN_ID, name, amount, probability: prob, color: '#3498db', texture_url: tex, is_active: true }) });
    alert('✅ تم الحفظ');
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
