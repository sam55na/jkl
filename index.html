<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmic Blast 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    
    #ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; pointer-events: none; }
    .top-bar { padding: 20px; text-align: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
    .status-text { font-size: 16px; color: #FFD700; margin-bottom: 5px; font-weight: bold; text-shadow: 0 0 10px #FFD700; }
    
    .bottom-bar { margin-top: auto; padding: 30px 20px; text-align: center; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); pointer-events: auto; }
    .btn-play { 
        background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; border: none; border-radius: 40px; 
        padding: 16px 40px; font-size: 18px; font-weight: 900; cursor: pointer; 
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); transition: 0.3s; width: 100%; max-width: 300px;
    }
    .btn-play:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    .card { background: linear-gradient(135deg, #1a1a2e, #0f3460); border: 2px solid #FFD700; border-radius: 24px; padding: 40px; text-align: center; transform: scale(0.8); transition: 0.4s; box-shadow: 0 0 60px rgba(255,215,0,0.4); }
    #modal.show .card { transform: scale(1); }
    .card-icon { font-size: 80px; margin-bottom: 10px; animation: float 2s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    .card-title { color: #FFD700; font-size: 24px; font-weight: bold; margin-bottom: 10px; }
    .card-amount { font-size: 40px; color: #00FF88; font-weight: 900; margin-bottom: 20px; }
    .btn-close { background: #FFD700; color: #000; padding: 12px 40px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }

    /* لوحة الإدارة */
    #admin-panel { position: fixed; inset: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 20px; z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
    #admin-panel.show { display: flex; }
    .admin-input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; width: 100%; outline: none; }
    .admin-btn { background: #FFD700; color: #000; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .prize-row { display: flex; gap: 8px; margin-bottom: 8px; background: #111; padding: 10px; border-radius: 8px; align-items: center; }
    .prize-row input[type="text"], .prize-row input[type="number"] { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; }
    .prize-row input[type="color"] { width: 35px; height: 35px; border: none; background: none; cursor: pointer; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="top-bar">
        <div class="status-text" id="status-text">استعد للانفجار!</div>
    </div>
    <div class="bottom-bar">
        <button class="btn-play" id="play-btn" disabled>انتظر...</button>
    </div>
</div>

<div id="modal">
    <div class="card">
        <div class="card-icon" id="m-icon">💎</div>
        <div class="card-title" id="m-title">مبروك!</div>
        <div class="card-amount" id="m-amount">0 SYP</div>
        <button class="btn-close" id="m-close">استلام</button>
    </div>
</div>

<div id="admin-panel">
    <h2 style="color:#FFD700; margin-bottom: 20px; text-align:center;">⚙️ لوحة الإدارة</h2>
    <label style="color:#888; font-size:12px;">رابط الخلفية:</label>
    <input type="text" id="a-bg" class="admin-input">
    <button class="admin-btn" onclick="saveBg()">حفظ الخلفية</button>
    
    <h3 style="color:#FFD700; margin:20px 0 10px; font-size:16px;">🪐 الجوائز</h3>
    <div id="admin-prizes"></div>
    
    <button class="admin-btn" style="background: #ff4444; color: white; margin-top:20px;" onclick="document.getElementById('admin-panel').classList.remove('show')">إغلاق</button>
</div>

<script>
// ================================================================
//   الإعدادات
// ================================================================
const API_BASE = 'https://jkl-ttvi.onrender.com';
const ADMIN_ID = "7011476249";
const urlParams = new URLSearchParams(window.location.search);
const isAdmin = urlParams.get('admin_id') === ADMIN_ID;
const USER_ID = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 123456789;

let winningPrizeId = null;
let isPlaying = false;
let planetsMeshes = [];
let particles = [];

// ================================================================
//   إعداد Three.js
// ================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 50;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff, 1.5, 100);
pointLight.position.set(0, 0, 20);
scene.add(pointLight);

// النجوم
const starGeometry = new THREE.BufferGeometry();
const starPositions = new Float32Array(2000 * 3);
for (let i = 0; i < 2000 * 3; i++) starPositions[i] = (Math.random() - 0.5) * 200;
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starField = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 }));
scene.add(starField);

// الشمس
const sun = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 32), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
scene.add(sun);
sun.add(new THREE.PointLight(0xFFD700, 2, 50));

// إنشاء كوكب
function createPlanet(color, size, orbitRadius, speed, prizeData) {
    const geometry = new THREE.SphereGeometry(size, 32, 32);
    const material = new THREE.MeshStandardMaterial({ 
        color: color, roughness: 0.4, metalness: 0.3, emissive: color, emissiveIntensity: 0.1 
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.userData = { prize: prizeData, orbitRadius, speed, angle: Math.random() * Math.PI * 2 };
    
    if (Math.random() > 0.5) {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(size * 1.4, size * 1.8, 32), 
            new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
        );
        ring.rotation.x = Math.PI / 2 + 0.3;
        mesh.add(ring);
    }
    scene.add(mesh);
    planetsMeshes.push(mesh);
}

// انفجار
function create3DExplosion(position, color) {
    const particleCount = 150;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const velocities = [];
    for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = position.x; positions[i * 3 + 1] = position.y; positions[i * 3 + 2] = position.z;
        velocities.push(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(Math.random() * 0.8 + 0.2));
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleSystem = new THREE.Points(geometry, new THREE.PointsMaterial({ color: color, size: 0.8, transparent: true, opacity: 1 }));
    particleSystem.userData = { velocities, life: 1 };
    scene.add(particleSystem);
    particles.push(particleSystem);
}

// حلقة الرسم
function animate() {
    requestAnimationFrame(animate);
    starField.rotation.y += 0.0005;
    planetsMeshes.forEach(mesh => {
        if (!mesh.visible) return;
        const d = mesh.userData;
        d.angle += d.speed;
        mesh.position.x = Math.cos(d.angle) * d.orbitRadius;
        mesh.position.z = Math.sin(d.angle) * d.orbitRadius * 0.5 - 10;
        mesh.position.y = Math.sin(d.angle) * d.orbitRadius * 0.2;
        mesh.rotation.y += 0.01;
    });
    for (let i = particles.length - 1; i >= 0; i--) {
        const ps = particles[i];
        const pos = ps.geometry.attributes.position.array;
        ps.userData.velocities.forEach((v, j) => { pos[j * 3] += v.x; pos[j * 3 + 1] += v.y; pos[j * 3 + 2] += v.z; });
        ps.geometry.attributes.position.needsUpdate = true;
        ps.material.opacity -= 0.01;
        ps.userData.life -= 0.01;
        if (ps.userData.life <= 0) { scene.remove(ps); particles.splice(i, 1); }
    }
    renderer.render(scene, camera);
}
animate();

// التفاعل
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('pointerdown', (event) => {
    if (!isPlaying) return;
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(planetsMeshes);
    if (intersects.length > 0) handlePlanetClick(intersects[0].object);
});

function handlePlanetClick(planet) {
    const prize = planet.userData.prize;
    fetch(`${API_BASE}/api/planet/click`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID, prize_id: prize.id })
    })
    .then(r => r.json())
    .then(data => {
        if (data.matched) {
            isPlaying = false;
            planet.visible = false;
            create3DExplosion(planet.position, prize.color);
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
            setTimeout(() => showModal(data.prize), 1000);
        } else {
            planet.material.emissiveIntensity = 1;
            setTimeout(() => planet.material.emissiveIntensity = 0.1, 200);
        }
    });
}

// بدء اللعبة
document.getElementById('play-btn').onclick = async () => {
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "جاري بدء اللعبة...";
    const res = await fetch(`${API_BASE}/api/planet/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: USER_ID })
    });
    const data = await res.json();
    if (data.success) {
        winningPrizeId = data.winning_prize_id;
        isPlaying = true;
        document.getElementById('play-btn').textContent = "اضغط على الكوكب الصحيح!";
        document.getElementById('status-text').textContent = "ابحث عن الكوكب...";
    } else {
        alert(data.error);
        document.getElementById('play-btn').disabled = false;
        document.getElementById('play-btn').textContent = "حاول مجدداً";
    }
};

// التهيئة
async function init() {
    const res = await fetch(`${API_BASE}/api/planet/data`);
    const data = await res.json();
    if (data.success) {
        data.prizes.forEach((p, index) => {
            const orbitRadius = 10 + (index * 5);
            createPlanet(p.color || '#3498db', 2 + (index * 0.5), orbitRadius, 0.002 + (index * 0.001), p);
        });
        const statusRes = await fetch(`${API_BASE}/api/planet/status/${USER_ID}`);
        const statusData = await statusRes.json();
        if (statusData.can_play) {
            document.getElementById('play-btn').disabled = false;
            document.getElementById('play-btn').textContent = "🚀 اختر كوكباً لتفجيره!";
        } else {
            document.getElementById('play-btn').disabled = true;
            document.getElementById('play-btn').textContent = statusData.deposit_met ? `انتظر ${statusData.remaining_hours} ساعة` : "يجب الإيداع أولاً";
        }
    }
    if (isAdmin) {
        document.getElementById('admin-panel').classList.add('show');
        loadAdminData();
    }
}

function showModal(prize) {
    document.getElementById('m-icon').textContent = prize.icon || '💎';
    document.getElementById('m-title').textContent = prize.name;
    document.getElementById('m-amount').textContent = `${prize.amount} SYP`;
    document.getElementById('modal').classList.add('show');
    document.getElementById('play-btn').disabled = true;
    document.getElementById('play-btn').textContent = "لقد انهيت الجولة!";
}
document.getElementById('m-close').onclick = () => document.getElementById('modal').classList.remove('show');

// الإدارة
async function loadAdminData() {
    const settingsRes = await fetch(`${API_BASE}/api/planet/admin/settings?admin_id=${ADMIN_ID}`);
    const settingsData = await settingsRes.json();
    if (settingsData.success) document.getElementById('a-bg').value = settingsData.settings.bg_image_url || '';

    const prizesRes = await fetch(`${API_BASE}/api/planet/admin/prizes?admin_id=${ADMIN_ID}`);
    const prizesData = await prizesRes.json();
    if (prizesData.success) {
        let html = '';
        prizesData.prizes.forEach(p => {
            html += `
                <div class="prize-row">
                    <input type="text" value="${p.name}" id="p-name-${p.id}" style="flex:2;">
                    <input type="number" value="${p.amount}" id="p-amount-${p.id}" style="flex:1;">
                    <input type="number" value="${p.probability}" id="p-prob-${p.id}" style="flex:1;">
                    <input type="color" value="${p.color}" id="p-color-${p.id}">
                    <button class="admin-btn" style="width:auto; padding:5px 15px; margin:0; font-size:12px;" onclick="savePrize(${p.id})">حفظ</button>
                </div>
            `;
        });
        document.getElementById('admin-prizes').innerHTML = html;
    }
}

async function saveBg() {
    const val = document.getElementById('a-bg').value;
    await fetch(`${API_BASE}/api/planet/admin/setting`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID, key: 'bg_image_url', value: val })
    });
    alert('تم الحفظ');
}

async function savePrize(id) {
    const name = document.getElementById(`p-name-${id}`).value;
    const amount = parseFloat(document.getElementById(`p-amount-${id}`).value);
    const prob = parseFloat(document.getElementById(`p-prob-${id}`).value);
    const color = document.getElementById(`p-color-${id}`).value;
    await fetch(`${API_BASE}/api/planet/admin/prizes/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: ADMIN_ID, name, amount, probability: prob, color, is_active: true })
    });
    alert('تم الحفظ');
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
